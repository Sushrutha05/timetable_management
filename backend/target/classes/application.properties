spring.application.name=timetable-api
# ---------------------------------------------
# POSTGRESQL DATABASE CONNECTION
# ---------------------------------------------

# Replace 'timetable' with the name of the database you created
spring.datasource.url=jdbc:postgresql://localhost:5432/schedule_planner

# Replace 'postgres' with your PostgreSQL username
spring.datasource.username=vaibhav

# Replace 'your_password' with your PostgreSQL password
spring.datasource.password=root


# ---------------------------------------------
# SPRING DATA JPA (HIBERNATE) SETTINGS
# ---------------------------------------------

# This shows you the SQL that JPA is running in the console. Very useful for debugging.
spring.jpa.show-sql=true

# This tells Hibernate (the JPA provider) to talk in PostgreSQL language.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 'validate' checks if your Java classes match the tables.
# 'update' can make small changes, but 'validate' is safer for production.
# We use 'validate' to force Spring to rely only on Flyway for schema changes.
spring.jpa.hibernate.ddl-auto=validate
# Tells Flyway to accept an existing database as 'V1'
spring.flyway.baseline-on-migrate=true